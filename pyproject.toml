[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "credit-keeper"
version = "0.1.0"
description = "Config-driven HTTP/HTTPS proxy that mutates headers, built on top of mitmproxy."
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "credit-keeper contributors"},
]
dependencies = [
    "mitmproxy>=12,<13",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
credit-keeper = "credit_keeper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_keeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
