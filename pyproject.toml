[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "credit-keeper"
version = "0.1.0"
description = "Config-driven HTTP/HTTPS proxy that mutates headers, built on top of mitmproxy."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "mitmproxy>=11,<13",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
credit-keeper = "credit_keeper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_keeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
