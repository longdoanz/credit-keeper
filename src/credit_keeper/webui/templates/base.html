<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}credit-keeper{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center space-x-6">
            <span class="font-bold text-lg">credit-keeper</span>
            <a href="/" class="hover:text-indigo-200">Dashboard</a>
            <a href="/credentials" class="hover:text-indigo-200">Credentials</a>
            <a href="/requests" class="hover:text-indigo-200">Requests</a>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
